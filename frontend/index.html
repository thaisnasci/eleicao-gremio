<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urna Eletrônica Escolar</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="pagina">

      <section id="urna" class="urna" aria-live="polite">

        <div class="monitor">
          <div id="conteudoTela"></div>
        </div>

        <div class="painel">

          <div class="teclado" id="teclado"></div>

          <div class="acoes">
            <button id="branco" class="botao branco">
              BRANCO
            </button>

            <button id="corrige" class="botao corrige">
              CORRIGE
            </button>

            <button id="confirma" class="botao confirma">
              CONFIRMA
            </button>
          </div>

        </div>

      </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
