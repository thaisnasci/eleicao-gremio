<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Estudantes</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <main class="cartao entrada">
      <h1>Cadastro de Estudantes</h1>

      <p>
        Cadastre as matrículas e os nomes dos estudantes autorizados a votar.
      </p>

      <form id="formCadastro">
        <label for="listaAlunos">
          Estudantes
        </label>

        <textarea
          id="listaAlunos"
          rows="10"
          required
          placeholder="2026001, João Silva
2026002, Maria Santos
2026003, Pedro Oliveira"
          style="
            width: 100%;
            padding: 12px;
            font: inherit;
            resize: vertical;
          "
        ></textarea>

        <p style="font-size: 14px; color: #666; text-align: left;">
          Coloque um estudante por linha no formato:
          <strong>Matrícula, Nome</strong>
        </p>

        <button
          type="submit"
          class="botao continuar"
        >
          CADASTRAR ESTUDANTES
        </button>
      </form>

      <p
        id="mensagem"
        class="mensagem"
        aria-live="polite"
      ></p>

      <p>
        <a href="admin.html">Voltar ao painel</a>
      </p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/cadastrar.js"></script>
  </body>
</html>
