<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Cadastro - Grêmio</title>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-gray-100">

  <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-lg border border-gray-700">
    <h1 class="text-2xl font-bold text-center text-blue-400 mb-2">Painel do Administrador</h1>
    <p class="text-sm text-gray-400 text-center mb-6">Insira as matrículas autorizadas a votar</p>
    
    <form id="formCadastro" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-300">Senha do Administrador:</label>
        <input type="password" id="senha" required class="w-full mt-1 p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-300">Lista de Matrículas (Separadas por vírgula):</label>
        <textarea id="listaMatriculas" rows="6" required placeholder="Exemplo: 202601, 202602, 202603, 202604" class="w-full mt-1 p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white placeholder-gray-500"></textarea>
        <small class="text-gray-400 block mt-1">Dica: Você pode copiar uma coluna inteira de números do Excel, colar aqui e apenas colocar vírgulas.</small>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition duration-200 cursor-pointer">CADASTRAR ALUNOS</button>
    </form>
    
    <p id="mensagem" class="mt-4 text-center font-semibold hidden"></p>
  </div>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const listaMatriculas = document.getElementById('listaMatriculas').value;
      const msgElement = document.getElementById('mensagem');

      try {
        const resposta = await fetch('/api/cadastrar-matriculas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha, listaMatriculas })
        });

        const dados = await resposta.json();
        msgElement.classList.remove('hidden', 'text-red-400', 'text-green-400');

        if (resposta.ok) {
          msgElement.innerText = "🎉 " + dados.mensagem;
          msgElement.classList.add('text-green-400');
          document.getElementById('listaMatriculas').value = "";
        } else {
          msgElement.innerText = "❌ " + dados.erro;
          msgElement.classList.add('text-red-400');
        }
      } catch (err) {
        msgElement.innerText = "❌ Erro ao conectar ao servidor.";
        msgElement.classList.add('text-red-400');
      }
    });
  </script>
</body>
</html>
